<template id="guideTpl">
<div class="guide">
  <div class="exam"><b>How Exam 1 works.</b> Short essay. Dr. Baker asks a big general question you can answer several ways and grades on completeness. Back every claim with an example from class. Expect an ED50 or therapeutic-index reading from a dose-response graph. Units cancel in ratios, so 60 mg ÷ 20 mg is 3, not 3 mg.</div>

  <details open><summary>Drugs, medicine &amp; policy</summary>
    <ul>
      <li>Every medicine is a drug. “Drug” vs “medicine” mostly reflects connotation and context, not chemistry. Even food alters mood.</li>
      <li><b>DEA schedules</b> run I (most restricted) to V (least). Schedule I means no accepted medical use plus high abuse potential.</li>
      <li>Cannabis is Schedule I because of history (Reefer Madness), not safety. That status blocks research.</li>
      <li>Alcohol isn't scheduled at all. In the UK harm study, alcohol caused the most harm to others. Heroin edged it out for harm to the user.</li>
      <li>Labeling shapes perception. Wellbutrin and Zyban are the same drug, bupropion, sold for ADHD/depression and for quitting smoking. Its effects list matches other stimulants'.</li>
      <li>Three policy approaches: legalize (often regulated), decriminalize, prohibit. Portugal decriminalized and expanded treatment. Oregon tried decriminalization. US alcohol Prohibition shows the costs of criminalizing a once-legal drug.</li>
    </ul>
  </details>

  <details open><summary>Getting in: routes &amp; absorption</summary>
    <ul>
      <li><b>Enteral</b>: through the alimentary canal (GI tract), like a swallowed pill. <b>Parenteral</b>: everything else.</li>
      <li>Parenteral routes: injection (IV, IM, subcutaneous), pulmonary, topical, sublingual, intranasal, cutaneous.</li>
      <li><b>Absorption</b> is the time for a population of drug to enter the blood. The bloodstream matters because once a drug is there, it reaches the whole body.</li>
      <li>Oral drugs take about 20–30 minutes to near peak blood levels. Edibles are unpredictable because GI absorption varies with food.</li>
      <li>Intranasal and sublingual are fast because capillaries sit right under the surface. Skin patches give slow, steady absorption.</li>
      <li>Gas anesthetics beat pills for surgery because they're fast and the dose is controllable.</li>
    </ul>
  </details>

  <details open><summary>Distribution &amp; the blood-brain barrier</summary>
    <ul>
      <li><b>Simple diffusion</b> moves drugs from high to low concentration. The blood connects every compartment: lungs, muscle, fat, brain, heart.</li>
      <li>Drugs leave the blood at <b>capillaries</b>, which have gaps between cells. Arteries and veins are sealed highways.</li>
      <li><b>Fat</b> matters. Lipid-soluble drugs store there and leak back into blood when blood levels fall, so they linger and have long half-lives. A blood test can miss drug still acting from tissue.</li>
      <li>Getting into a cell means crossing a lipid bilayer, so the drug needs lipid solubility unless a transporter exists. Albumin carries fat-soluble molecules through blood.</li>
      <li>SSRIs: about 5× more serotonin in the gut than the brain, so the main effect is GI distress. Prof: an SSRI is a gut drug that also acts on the brain, which is why nobody misuses them.</li>
      <li>Large peptides (collagen supplements) get chopped into amino acids. You're paying for soy sauce.</li>
      <li><b>Blood-brain barrier</b> = brain capillaries with tight gaps + glial cells. A molecule crosses <b>4 membranes</b>: 2 through the capillary cell, 2 through the glial cell.</li>
      <li>Why it exists: neurons are lost daily and not replaced, so toxins must stay out. But the brain is energy- and oxygen-hungry, so nutrients must get in.</li>
    </ul>
  </details>

  <details open><summary>Getting out: liver, kidneys, half-life</summary>
    <ul>
      <li>Elimination is a liver–kidney team. Kidneys filter waste into urine, but urine is water, so lipid-soluble drugs don't go easily.</li>
      <li>The liver's <b>biotransformation</b> makes drugs less lipid-soluble so the kidneys can excrete them.</li>
      <li><b>Active metabolites</b> still affect the brain. Heroin breaks down into morphine.</li>
      <li><b>Cytochrome P450 (CYP)</b> enzymes: 90% of drugs are metabolized by six of them. Poor ~10%, intermediate ~10%, extensive ~78%, ultra-rapid ~2%.</li>
      <li>Other exits: lungs (gas anesthetics), bile, sweat and breast milk.</li>
      <li><b>MAOIs</b> block monoamine oxidase, which breaks down serotonin, dopamine and norepinephrine. Food monoamines then build up (“cheese reaction”): racing heart, dangerous blood pressure.</li>
      <li><b>Half-life</b> is the time to clear half of a dose from the blood. 4 half-lives clear about 94%. With daily doses, slow clearance means accumulation.</li>
    </ul>
    <div class="tbl"><table class="ht"><thead><tr><th>Half-lives</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr></thead><tbody><tr><th>% left</th><td>100</td><td>50</td><td>25</td><td>12.5</td><td>6.2</td><td>3.1</td><td>1.6</td></tr></tbody></table></div>
  </details>

  <details open><summary>Receptors &amp; effects</summary>
    <ul>
      <li>A drug receptor must meet two criteria: the drug binds to it, and binding alters a normal physiological event.</li>
      <li>Three receptor types: neurotransmitter receptors, enzymes, membrane transporters (like serotonin or dopamine reuptake).</li>
      <li><b>Agonist</b> mimics or enhances (a hairpin that opens the lock). <b>Antagonist</b> blocks. Narcan is an opioid antagonist that knocks opioids off their receptors.</li>
      <li>A drug binds every receptor it can, inside and outside the brain. “Side effects are just effects.”</li>
      <li>A drug never has a single effect, even at one receptor. Dopamine in the nucleus accumbens drives motivation, dopamine in motor circuits drives movement, so antipsychotics cause motor and facial side effects.</li>
      <li>Opioid pain relief and breathing suppression (brainstem) share receptors, so they can't be separated.</li>
      <li>“The only clean drugs are new drugs.” We just haven't found the other targets yet. Report strange effects, since that's how warnings and even tainted generics get caught.</li>
    </ul>
  </details>

  <details open><summary>Dose-response &amp; therapeutic index</summary>
    <ul>
      <li>More dose means more receptors bound and more effect, until a plateau, because receptors (or the behavior) max out.</li>
      <li>Population curves: the frequency distribution shows how many respond at each dose. The <b>cumulative</b> plot climbs to 100% and is the one for reading ED values.</li>
      <li><b>ED50</b> is the dose at which 50% of subjects show the effect. To read it, go across from 50%, hit the curve, drop to the x-axis.</li>
      <li><b>LD50</b> is the dose lethal to 50%, found through animal research.</li>
      <li><b>Therapeutic index = LD50 ÷ ED50.</b> Bigger is safer. Lecture example: 130 ÷ 30 ≈ 4.</li>
      <li>Every effect has its own curve, so a drug can have several TIs (an ADHD med has one for heart palpitations).</li>
      <li>People differ: sensitive people need little, resistant people need a lot, and some get the unwanted effect first. Prescribing is partly an “art”.</li>
    </ul>
  </details>

  <details open><summary>Brain systems &amp; transmitters</summary>
    <p class="muted" style="margin:0 0 6px;font-size:15px">Built from the Week 2 slides plus standard textbook facts. Add your own notes from the Day 4 lecture.</p>
    <ul>
      <li>Developmental divisions: forebrain (telencephalon, diencephalon), midbrain (mesencephalon), hindbrain (metencephalon, myelencephalon).</li>
      <li><b>Limbic system</b>: interconnected nuclei that regulate emotion.</li>
      <li><b>Nigrostriatal</b>: substantia nigra (midbrain) to basal ganglia; coordinates behavior and choices.</li>
      <li><b>Medial forebrain bundle</b>: axons projecting throughout the brain; arousal and reinforcement.</li>
      <li><b>VTA → nucleus accumbens</b>: once seen as the reinforcement center, now the locus of “craving”, “liking” and “wanting”. It sits in a larger limbic circuit using dopamine, GABA, glutamate, ACh and endogenous opioids.</li>
      <li>At the <b>synapse</b>, a neuron releases neurotransmitter onto postsynaptic receptors, which excite or inhibit the target.</li>
      <li>Transmitter classes: acetylcholine (arousal, learning, memory, attention); monoamines (dopamine, norepinephrine, serotonin); amino acids (glutamate excites, GABA inhibits); peptides (endorphins); endocannabinoids.</li>
      <li>Dependence is never a “one area, one transmitter” thing.</li>
    </ul>
  </details>

  <details open><summary>Tolerance</summary>
    <ul>
      <li>Tolerance is the whole system compensating for a drug to get back to equilibrium, so you need more for the same effect.</li>
      <li><b>Metabolic</b>: the liver makes more enzymes and clears the drug faster.</li>
      <li><b>Pharmacodynamic</b>: the brain changes receptor numbers at the synapse.</li>
      <li><b>Behavioral</b>: rats that practiced the treadmill while drunk got better at running drunk. Rats given alcohol after practice didn't. Same alcohol, so it isn't metabolic.</li>
      <li><b>Learned</b>: environmental cues trigger the compensatory response in advance. Rats given morphine in their usual morphine room showed less sedation than rats given the same dose in the saline room. Chemo patients feel nauseous from treatment-room cues.</li>
      <li>Why it matters: a familiar dose hits much harder in an unfamiliar context, which is a known factor in opioid overdose.</li>
    </ul>
  </details>

  <details open><summary>Withdrawal &amp; dependence</summary>
    <ul>
      <li>Withdrawal is the leftover compensatory response after stopping a chronic drug. Symptoms are the opposite of the drug's effects: stop a sedative like alcohol and you get overactivation.</li>
      <li><b>Abstinence syndrome</b> is the medical term.</li>
      <li><b>Physical dependence</b> is a retrospective observation: you only know it once stopping produces an abstinence syndrome. Prof drinks lots of caffeine, feels nothing on stopping, so isn't dependent by this definition.</li>
      <li><b>Psychological dependence</b> is ill-defined: intense drug seeking from a keen desire. Cannabis is the example.</li>
      <li>Abstinence syndromes are increasingly recognized for ADHD meds, antidepressants and anxiolytics. Physical vs psychological is less separate than it sounds.</li>
    </ul>
  </details>

  <details open><summary>Addiction &amp; substance use disorder</summary>
    <ul>
      <li>DSM-5 defines a separate use disorder per substance. Caffeine can't be diagnosed.</li>
      <li>At least 2 symptoms: 2–3 mild, 4–5 moderate, 6+ severe. DSM-IV split “abuse” and “dependence”.</li>
      <li>Prof's critique: the criteria are almost all social and psychological, with almost no biology.</li>
      <li>Definition 1: a behavioral pattern of compulsive use or over-involvement with a tendency to relapse.</li>
      <li>Definition 2: a primary chronic neurobiologic disease (genetic, psychosocial, environmental) marked by impaired control, compulsive use, use despite harm and craving.</li>
      <li>“Addiction” carries moral judgment, but it's broader: gambling counts.</li>
    </ul>
  </details>

  <details open><summary>Sensitization, set, setting &amp; placebo</summary>
    <ul>
      <li><b>Sensitization</b>: repeated amphetamine or cocaine increases the effect. Rats given methylphenidate daily run around more. It lasts a year or more, so it isn't the same mechanism as tolerance, and it helps explain cue sensitivity and relapse.</li>
      <li><b>Set</b> = the user's expectations. <b>Setting</b> = the environment. A stimulant before class helps focus; before a party it helps people have fun.</li>
      <li>Placebo is traditionally “no physiological effect” or a deception. Prof: the effects are robust, so it isn't inert, and it can be used ethically.</li>
      <li>1950s “Surgery as Placebo”: expectation drove recovery from heart surgery. Sham knee and back surgeries match real ones.</li>
      <li>1990s antidepressant FDA trials: only 14% beat placebo on every measure. Paxil needed 9 trials to get 2 positive.</li>
      <li><b>Number needed to treat</b>: patients who must take a drug for one to benefit beyond placebo. High for psychiatric meds.</li>
      <li>Mechanism: frontal cortex projects to the reinforcement circuit (VTA, accumbens) and down to pain-modulating pathways.</li>
      <li>Double-blind placebo-controlled trials are how we know a drug works.</li>
    </ul>
  </details>

// policy
{id:"pol1",u:"pol",t:"pick",d:1,q:"Which DEA schedule is for drugs with no accepted medical use and high abuse potential?",c:["Schedule I","Schedule II","Schedule III","Schedule V"],ok:"Schedule I",x:"Schedules run from I (most restricted) to V (least). Schedule I means no accepted medical use plus high abuse potential."},

{id:"pol4",u:"pol",t:"type",d:2,q:"According to lecture, why is cannabis Schedule I?",k:[["history","reefer","politic","propaganda","not safety","stigma","culture"]],x:"Its status traces to history and propaganda like Reefer Madness, not a safety finding. Schedule I status also makes it very hard to research."},
{id:"pol5",u:"pol",t:"type",d:1,q:"Wellbutrin (bupropion) is also sold for quitting smoking under what brand name?",a:["zyban"],x:"Zyban. Same molecule, two names, two uses. Its side-effect list looks like any other stimulant’s, which shows how labeling shapes perception."},

{id:"pol7",u:"pol",t:"type",d:2,q:"Name the three broad approaches to drug policy discussed in class.",k:[["legaliz","legal"],["decriminaliz"],["prohibit","criminaliz","illegal","ban","war on drugs"]],x:"Legalize (often regulated), decriminalize, or prohibit. US alcohol Prohibition is the case study for criminalizing a once-legal drug."},
{id:"pol8",u:"pol",t:"type",d:3,q:"Why is it hard to define “drug” versus “medicine”?",k:[["overlap","same","connotation","context","depends","all medicines","every medicine","use","perception"]],x:"Every medicine is a drug. The label mostly reflects connotation and context of use (helpful vs harmful), not chemistry. Even food alters mood."},
// in
{id:"in1",u:"in",t:"type",d:1,q:"What are the two general paths for getting a drug into the body?",k:[["enteral"],["parenteral"]],x:"Enteral goes through the alimentary canal (GI tract). Parenteral is every other route."},
{id:"in2",u:"in",t:"type",d:1,q:"Enteral administration goes through the ___.",k:[["alimentary","gi","gastro","digestive","gut","stomach","intestin"]],x:"The alimentary canal, meaning the GI tract. A swallowed pill is the classic example."},
{id:"in3",u:"in",t:"pick",d:1,q:"Which of these is NOT a parenteral route?",c:["Swallowing a pill","Intravenous","Sublingual","Intranasal"],ok:"Swallowing a pill",x:"Oral is enteral. Parenteral includes IV, IM, subcutaneous, pulmonary, topical, sublingual, intranasal and cutaneous."},
{id:"in4",u:"in",t:"type",d:2,q:"Why does intranasal absorption work so well?",k:[["capillar","blood vessel","vascular"]],x:"Nasal passages and sinuses are full of capillaries near the surface, so the drug reaches blood quickly."},

{id:"in6",u:"in",t:"type",d:1,q:"Define absorption.",k:[["time","rate","how long","speed","how fast"],["blood"]],x:"The time it takes for a population of drug to enter the blood after administration."},
{id:"in7",u:"in",t:"type",d:1,q:"Why is reaching the bloodstream the key step?",k:[["whole body","entire body","everywhere","all over","circulat","every","throughout","all compartments"]],x:"Once it’s in the blood, it reaches the whole body."},
{id:"in8",u:"in",t:"pick",d:1,q:"Roughly how long do most oral drugs take to approach peak blood concentration?",c:["20–30 minutes","2–3 minutes","4–6 hours","24 hours"],ok:"20–30 minutes",x:"About 20–30 minutes, and some take longer."},
{id:"in9",u:"in",t:"type",d:2,q:"Why are edibles so unpredictable?",k:[["food","stomach","digest","absorb","absorption","gi","gut","meal"]],x:"Oral absorption of complex cannabinoid molecules varies a lot, especially with how much food is in the stomach."},
{id:"in10",u:"in",t:"type",d:3,q:"Why are gas anesthetics safer than pills for putting someone under for surgery?",k:[["fast","quick","rapid","speed"],["control","dose","predict","absorption","vary"]],x:"Inhaled drugs reach the brain fast and the dose stays controllable. Pill absorption varies, which makes the dose hard to control when the goal is very deep unconsciousness. Ketamine is an injectable exception with a wide safety margin."},
{id:"in11",u:"in",t:"type",d:2,q:"Skin patches use which route, and what’s the advantage?",k:[["skin","transderm","cutaneous","topical"],["steady","slow","constant","even","stable","consistent"]],x:"Cutaneous (through the skin). Absorption is slow and steady."},
// move
{id:"move1",u:"move",t:"type",d:1,q:"What is the primary force moving drugs through the body?",k:[["diffusion"]],x:"Simple diffusion: molecules spread from high to low concentration. Blood flow stirs, diffusion moves drug into tissue."},
{id:"move2",u:"move",t:"pick",d:1,q:"Drugs diffuse from areas of ___ concentration to areas of ___ concentration.",c:["high → low","low → high","any direction equally","fat → blood only"],ok:"high → low",x:"High to low. When tissue levels exceed blood levels, the flow reverses and drug leaks back into blood."},
{id:"move3",u:"move",t:"type",d:1,q:"Where in the circulatory system do drugs leave the blood?",k:[["capillar"]],x:"Capillaries. They have gaps between cells. Arteries and veins are sealed highways."},
{id:"move4",u:"move",t:"type",d:2,q:"Why is fat an important compartment in psychopharmacology?",k:[["lipid","fat soluble","lipophilic"],["store","hold","linger","long","half","slow","leak","reservoir","stay"]],x:"Lipid-soluble drugs build up in fat and leak back into blood as blood levels fall. That lengthens their half-life."},
{id:"move5",u:"move",t:"type",d:3,q:"Why might a blood test not show whether a drug is still having an effect?",k:[["tissue","fat","stored","compartment"]],x:"Drug can linger in tissues like fat and slowly diffuse back into blood, so blood levels understate what’s still on board."},
{id:"move6",u:"move",t:"type",d:2,q:"To get INSIDE a cell, what must a drug cross, and what property helps?",k:[["lipid","membrane","bilayer","fat"],["solub","lipophilic","dissolve"]],x:"A lipid bilayer. Unless a specific transporter exists (uncommon), the drug needs lipid solubility."},
{id:"move7",u:"move",t:"type",d:2,q:"Which blood protein carries fat-soluble molecules through the bloodstream?",a:["albumin"],x:"Albumin. Drugs bind it, travel, then hopefully let go at the right time."},
{id:"move8",u:"move",t:"type",d:2,q:"What’s the most common side effect of SSRIs, and why?",k:[["gi","gut","gastro","stomach","nausea","digest"],["serotonin","5 times","five times","receptor"]],x:"GI distress. There’s about 5× more serotonin in the gut than in the brain, so much of the binding happens there. An SSRI is mainly a gut drug that also acts on the brain."},
{id:"move9",u:"move",t:"pick",d:2,q:"Collagen and other peptide supplements are poorly absorbed intact because they are:",c:["Too large, so the body breaks them into amino acids","Too lipid soluble","Blocked by the BBB","Exhaled by the lungs"],ok:"Too large, so the body breaks them into amino acids",x:"They’re big chains that get chopped into amino acids. The prof’s line: you could drink soy sauce."},
{id:"move10",u:"move",t:"type",d:1,q:"Name the two components of the blood-brain barrier.",k:[["tight","capillar"],["glia","astrocyte"]],x:"Brain capillaries with tight gaps, and glial cells wrapped around them."},
{id:"move11",u:"move",t:"pick",d:2,q:"How many membranes does a molecule cross to get from blood into the brain?",c:["4","2","1","6"],ok:"4",x:"Four. Two through the capillary cell (in and out) and two through the glial cell."},
{id:"move12",u:"move",t:"type",d:2,q:"Why does the brain need a blood-brain barrier?",k:[["neuron","toxin","protect","replace","loss"]],x:"Neurons are lost daily and not replaced, so the brain must be shielded from toxins. It’s also energy- and oxygen-hungry, so nutrients still need a way in."},

{id:"out2",u:"out",t:"type",d:2,q:"Why can’t the kidneys easily excrete highly lipid-soluble drugs?",k:[["urine","water","liquid"]],x:"Urine is water-based, so it doesn’t readily carry lipid-soluble molecules."},
{id:"out3",u:"out",t:"type",d:2,q:"What does the liver do to make a drug excretable?",k:[["transform","metaboli","break","convert","biotransform","change"],["water","less lipid","less fat","soluble"]],x:"Biotransformation: it converts lipid-soluble drugs into less lipid-soluble forms the kidneys can excrete."},
{id:"out4",u:"out",t:"type",d:1,q:"A breakdown product that still affects the brain is called an ___.",a:["active metabolite"],x:"An active metabolite."},

{id:"out6",u:"out",t:"type",d:1,q:"Which family of liver enzymes metabolizes most drugs?",k:[["p450","p 450","cyp","cytochrome"]],x:"Cytochrome P450 (CYP). About 90% of drugs are handled by six of these enzymes."},
{id:"out7",u:"out",t:"pick",d:2,q:"About what percent of people are “extensive” (typical) CYP metabolizers?",c:["78%","10%","2%","50%"],ok:"78%",x:"Poor ~10%, intermediate ~10%, extensive ~78%, ultra-rapid ~2%. Same dose, very different blood levels."},
{id:"out8",u:"out",t:"type",d:2,q:"Name the four CYP metabolizer categories.",k:[["poor"],["intermediate"],["extensive"],["ultra","rapid"]],x:"Poor, intermediate, extensive, ultra-rapid."},
{id:"out9",u:"out",t:"type",d:3,q:"Besides the liver and kidneys, name the three other ways drugs leave the body.",k:[["lung","breath","exhal"],["bile"],["sweat","milk","breast"]],x:"Lungs (gas anesthetics), bile (into the intestines), and fluids like sweat and breast milk."},
{id:"out10",u:"out",t:"type",d:1,q:"Define half-life.",k:[["half"],["time","how long"]],x:"The time it takes to clear half of an initial dose from the blood."},
{id:"out11",u:"out",t:"pick",d:1,q:"About how many half-lives clear ~94% of a drug?",c:["4","2","10","1"],ok:"4",x:"Four: 100 → 50 → 25 → 12.5 → 6.2% left."},
{id:"out12",u:"out",t:"type",d:3,q:"What does an MAOI do, and what is the “cheese reaction”?",k:[["break","monoamine oxidase","enzyme","block","inhibit","prevent"],["cheese","food","tyramine","heart","blood pressure","too much","build"]],x:"Monoamine oxidase breaks down serotonin, dopamine and norepinephrine. MAOIs block it, which is how they work as antidepressants. Gut MAO also clears monoamines from food, so on an MAOI those build up after foods like aged cheese, spiking heart rate and blood pressure."},
{id:"out13",u:"out",t:"type",d:3,q:"Why does half-life matter for a drug taken every day?",k:[["accumul","build","left over","leftover","remain","stack","toxic"]],x:"If the last dose isn’t cleared, drug accumulates. Sometimes that’s used on purpose to ramp up; sometimes it causes accidental toxicity."},

{id:"rec3",u:"rec",t:"pick",d:1,q:"A drug that mimics or enhances a neurotransmitter’s normal action is an:",c:["Agonist","Antagonist","Enzyme","Metabolite"],ok:"Agonist",x:"Agonist: a hairpin that also opens the lock. An antagonist blocks the lock."},
{id:"rec4",u:"rec",t:"pick",d:1,q:"Narcan (naloxone) reverses an opioid overdose. What kind of drug is it?",c:["Opioid receptor antagonist","Opioid agonist","Reuptake inhibitor","MAO inhibitor"],ok:"Opioid receptor antagonist",x:"An antagonist that outcompetes opioids for the receptor and knocks them off."},

{id:"rec7",u:"rec",t:"type",d:3,q:"Why do antipsychotics often cause motor side effects?",k:[["dopamine"],["motor","movement","nigro","basal","striat","face","facial"]],x:"Dopamine receptors drive motivation in the nucleus accumbens but also control movement in motor circuits. A dopamine drug hits both. A drug never has a single effect, even at one receptor type."},

{id:"dose1",u:"dose",t:"pick",d:1,q:"As dose increases, what happens on a dose-response curve?",c:["Effect rises, then plateaus","Effect rises forever","Effect stays flat","Effect drops right away"],ok:"Effect rises, then plateaus",x:"More molecules bind more receptors until receptors or the behavior max out."},
{id:"dose2",u:"dose",t:"type",d:2,q:"Why does a dose-response curve plateau?",k:[["receptor","limit","max","bound","all","ceiling"]],x:"There’s a limited number of receptors, and the behavior itself has a ceiling (a rat can only run so fast)."},

{id:"dose4",u:"dose",t:"pick",d:2,q:"ED95 is the dose at which:",c:["95% of subjects show the effect","One person reaches 95% of max effect","95% of subjects die","95% of the drug is cleared"],ok:"95% of subjects show the effect",x:"The subscript is the percent of subjects showing that effect."},

{id:"tol1",u:"tol",t:"type",d:1,q:"In one line, what is tolerance?",k:[["less","reduced","decrease","more","higher","same effect","compensat","weaker"]],x:"A reduced effect with repeated use, so more drug is needed for the same effect. The system is compensating to restore equilibrium."},
{id:"tol2",u:"tol",t:"type",d:2,q:"Where does metabolic tolerance happen, and how?",k:[["liver"],["enzyme","faster","more","break"]],x:"The liver ramps up its enzymes, so the drug is broken down faster."},
{id:"tol3",u:"tol",t:"type",d:2,q:"What changes in pharmacodynamic tolerance?",k:[["receptor","synapse","brain","sensitiv"]],x:"The brain adjusts, for example changing the number of receptors available at the synapse."},
{id:"tol4",u:"tol",t:"type",d:2,q:"Describe the treadmill experiment for behavioral tolerance.",k:[["practic","train","during","while"],["drunk","alcohol","intoxicat","booze"]],x:"Rats that practiced on the treadmill while drunk got better at it while drunk. Rats given alcohol after practice didn’t. Same alcohol exposure, so it isn’t metabolic: practice under the drug is what matters."},
{id:"tol5",u:"tol",t:"type",d:2,q:"Define learned tolerance.",k:[["cue","environment","context","setting","room","place"]],x:"Compensatory responses set off by environmental cues that predict the drug."},
{id:"tol6",u:"tol",t:"pick",d:3,q:"Rats got morphine in Room A and saline in Room B on alternating days. On test day, which showed the MOST sedation?",c:["Morphine given in Room B","Morphine given in Room A","Saline given in Room A","Both morphine groups equally"],ok:"Morphine given in Room B",x:"In the familiar morphine room the body braced for the drug, so sedation was smaller. In the saline room there was no anticipatory compensation, so the same dose hit harder. This is why context matters for overdose risk."},
{id:"tol7",u:"tol",t:"type",d:2,q:"What medical example of learned tolerance did the prof give?",k:[["chemo"]],x:"Chemotherapy. Patients react to treatment-room cues, so clinics make those rooms pleasant with gardens and windows."},
{id:"tol8",u:"tol",t:"type",d:3,q:"Why does the body build tolerance at all?",k:[["equilibrium","homeostasis","balance","compensat","normal"]],x:"The body constantly seeks equilibrium. It doesn’t know you want the drug’s effect, only that something knocked it off balance."},
// wd
{id:"wd1",u:"wd",t:"type",d:2,q:"Why are withdrawal symptoms usually the opposite of the drug’s effects?",k:[["equilibrium","compensat","adapt","homeostasis","balance"]],x:"Chronic use builds a compensatory response and a new equilibrium. Remove the drug and the compensation is left unopposed, so you swing the other way."},
{id:"wd2",u:"wd",t:"pick",d:1,q:"Alcohol is a sedative. Alcohol withdrawal is therefore marked by:",c:["Overactivation","More sedation","No change","Calm euphoria"],ok:"Overactivation",x:"The body was pushing activation up to offset the sedative. Without the sedative, it overshoots."},
{id:"wd3",u:"wd",t:"type",d:1,q:"What is the more medical term for withdrawal?",a:["abstinence syndrome"],x:"Abstinence syndrome: a constellation of responses opposite to the drug’s effects."},
{id:"wd4",u:"wd",t:"type",d:2,q:"Why is physical dependence called a “retrospective observation”?",k:[["stop","halt","after","abstinen","withdraw","take away","remove","quit"]],x:"You only know someone was physically dependent after the drug stops and an abstinence syndrome appears."},
{id:"wd5",u:"wd",t:"type",d:2,q:"What is psychological dependence, and which drug is the classic example?",k:[["crav","desire","seek","want"],["cannabis","marijuana","weed"]],x:"An ill-defined term for intense drug seeking from a keen desire for the drug. Cannabis: strong cravings, unclear physical abstinence syndrome."},
{id:"wd6",u:"wd",t:"pick",d:2,q:"By the lecture’s definition, is the prof physically dependent on caffeine?",c:["No, stopping causes them no withdrawal","Yes, they drink a lot","Yes, caffeine always causes dependence","It can’t be determined"],ok:"No, stopping causes them no withdrawal",x:"Dependence is defined by what happens when you stop, not by how much you use."},
{id:"wd7",u:"wd",t:"type",d:3,q:"Which commonly prescribed drug classes are increasingly recognized to have an abstinence syndrome?",k:[["adhd","stimul"],["antidepress","ssri"],["anxi","benzo"]],x:"ADHD medications, antidepressants and anxiolytics, among others."},
// add
{id:"add1",u:"add",t:"type",d:1,q:"Which substance can’t be diagnosed as a substance use disorder in DSM-5?",a:["caffeine","coffee"],x:"Caffeine."},
{id:"add2",u:"add",t:"pick",d:2,q:"What’s the minimum number of symptoms for a DSM-5 substance use disorder?",c:["2","1","4","6"],ok:"2",x:"2–3 mild, 4–5 moderate, 6 or more severe."},
{id:"add3",u:"add",t:"pick",d:2,q:"Four or five DSM-5 symptoms means the disorder is:",c:["Moderate","Mild","Severe","Not a disorder"],ok:"Moderate",x:"2–3 mild, 4–5 moderate, 6+ severe."},
{id:"add4",u:"add",t:"type",d:2,q:"How did DSM-IV differ from DSM-5 for alcohol?",k:[["abuse"],["dependen"]],x:"DSM-IV split alcohol abuse from alcohol dependence. DSM-5 merged them into one use disorder rated mild, moderate or severe."},
{id:"add5",u:"add",t:"type",d:3,q:"What did the prof say is conspicuously missing from the DSM criteria?",k:[["biolog","physiolog","brain"]],x:"Biology. The criteria are almost all social and psychological."},
{id:"add6",u:"add",t:"type",d:2,q:"Why might someone prefer “substance use disorder” to “addiction”?",k:[["moral","judg","stigma","negative"]],x:"“Addiction” carries moral judgment. It is broader, though: you can be addicted to gambling."},
{id:"add7",u:"add",t:"type",d:3,q:"Give the two lecture definitions of addiction.",k:[["behavior","pattern","compulsive"],["disease","neurobiolog","chronic"]],x:"1) A behavioral pattern of compulsive use or over-involvement, with a tendency to relapse. 2) A primary chronic neurobiologic disease with genetic, psychosocial and environmental factors."},
{id:"add8",u:"add",t:"type",d:2,q:"List the four behaviors in the “disease” definition of addiction.",k:[["control"],["compulsive"],["harm","despite"],["crav"]],x:"Impaired control, compulsive use, continued use despite harm, craving."},
// plac
{id:"plac1",u:"plac",t:"type",d:1,q:"Define “set” and “setting”.",k:[["expect","mindset","belief"],["environment","place","surround","context"]],x:"Set is the user’s expectations. Setting is the immediate environment."},
{id:"plac2",u:"plac",t:"type",d:2,q:"Give the prof’s stimulant example of set and setting.",k:[["class","study","focus","school"],["party","fun","social"]],x:"Before class a stimulant helps focus. Before a party it helps people have a good time. Same drug, different expectation and environment."},
{id:"plac3",u:"plac",t:"type",d:2,q:"What is drug sensitization?",k:[["increas","greater","more","stronger","bigger"]],x:"Repeated exposure (amphetamine, cocaine) makes the drug’s effect bigger over time."},
{id:"plac4",u:"plac",t:"pick",d:2,q:"How long can sensitization last?",c:["A year or more","A few hours","One day","Exactly one week"],ok:"A year or more",x:"That duration means its mechanism differs from short-lived tolerance and withdrawal."},
{id:"plac5",u:"plac",t:"type",d:3,q:"Why does sensitization matter for relapse?",k:[["cue","trigger","crav","sensitiv"]],x:"Long-lasting sensitization helps explain heightened reactions to drug-related cues, which drives craving and relapse."},
{id:"plac6",u:"plac",t:"type",d:3,q:"Can someone have tolerance and sensitization to the same drug?",k:[["yes","both","some effects","different"]],x:"Yes. With stimulants you can grow tolerant to some effects and sensitized to others."},
{id:"plac7",u:"plac",t:"type",d:2,q:"What’s the traditional definition of a placebo, and why does the prof push back?",k:[["no","inert","sugar","decept","lie","fake"],["robust","real","effect","work","not inert"]],x:"Traditionally a substance with no physiological effect, given to placate a patient. But placebo effects are robust, so it can’t be inert, and it can be used ethically."},
{id:"plac8",u:"plac",t:"type",d:2,q:"What did the 1950s “Surgery as Placebo” heart study find?",k:[["expect","believ"],["recover","improv","heal","work","better"]],x:"Patients’ expectation of success drove their recovery from heart surgery."},
{id:"plac9",u:"plac",t:"pick",d:3,q:"In 1990s FDA trials for five antidepressants, what share found the drug beat placebo on ALL depression measures?",c:["14%","50%","80%","95%"],ok:"14%",x:"Only 14%. Paxil needed nine trials to get two showing a difference."},
{id:"plac10",u:"plac",t:"type",d:2,q:"What is the number needed to treat (NNT)?",k:[["number","how many"],["patient","people"]],x:"How many patients must take a drug for one to benefit beyond the placebo effect. It’s high for psychiatric meds."},
{id:"plac11",u:"plac",t:"type",d:3,q:"Which brain region is common to both placebo pathways, and what are the two pathways?",k:[["frontal"],["reward","reinforce","vta","accumbens","dopamine"],["pain"]],x:"Frontal cortex. It projects to the reinforcement circuit (VTA, nucleus accumbens) and down to pain-modulating structures."},
{id:"plac12",u:"plac",t:"type",d:2,q:"What study design controls for placebo effects?",k:[["double blind","blind"],["placebo","control"]],x:"Double-blind, placebo-controlled trials."},

const QBY=Object.fromEntries(Q.map(q=>[q.id,q]));

/* ---------- state ---------- */
const KEY="psych4110-dosequest-v1";
const blank=()=>({xp:0,streak:0,best:0,answered:0,right:0,box:{},run:null,sound:false});
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign(blank(),JSON.parse(r)):blank()}catch(e){return blank()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let view="home", confirmReset=false;

const RANKS=["Placebo","Microdose","Threshold","ED10","ED50","ED95","Steady State","Therapeutic Index","Half-Life Master","Psychopharmacologist"];
const need=l=>50*l*(l-1);
function lvlFor(xp){let l=1;while(need(l+1)<=xp)l++;return l}
const rank=l=>RANKS[Math.min(l-1,RANKS.length-1)];
const DAY=864e5, GAPS=[0,0,1,2,4,7];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function norm(s){return String(s||"").toLowerCase().replace(/[’'`]/g,"").replace(/[–—-]/g," ").replace(/[^a-z0-9%.÷/\s]/g," ").replace(/\s+/g," ").trim()}
function hasTerm(n,w){w=norm(w);if(!w)return false;if(w.length<=3)return(" "+n+" ").includes(" "+w+" ");return n.includes(w)}
function gradeText(q,input){
  const n=norm(input); if(!n) return "miss";
  if(q.a && q.a.some(a=>hasTerm(n,a))) return "right";
  if(q.k){const hits=q.k.filter(g=>g.some(w=>hasTerm(n,w))).length;
    if(hits===q.k.length) return "right"; if(hits>0 && hits>=q.k.length/2) return "close";}
  return "miss";
}
function autoHint(q){
  if(q.h) return q.h;
  if(q.a) return "Starts with “"+q.a[0][0].toUpperCase()+"” · "+q.a[0].length+" letters";
  if(q.k) return "Mention "+q.k.length+" idea"+(q.k.length>1?"s":"")+": "+q.k.map(g=>g[0].slice(0,4)+"…").join(", ");
  return "";
}
function mastery(uid){const qs=Q.filter(q=>q.u===uid&&q.t!=="essay");const tot=qs.reduce((s,q)=>s+((S.box[q.id]&&S.box[q.id].b)||0),0);return tot/(qs.length*5)}
function prio(q){const b=S.box[q.id];if(!b)return 1+Math.random()*0.8;return b.b+(b.due<=Date.now()?-1.5:1)+Math.random()*0.8}
function reviewPool(){return Q.filter(q=>{const b=S.box[q.id];return b&&(b.b<=2||b.due<=Date.now())})}

/* ---------- generated problems ---------- */
const logi=(d,ed,s)=>100/(1+Math.exp(-(d-ed)/s));
function chartSVG(curves,label){
  const W=380,H=258,L=50,R=366,T=26,B=208,x=d=>L+(d/100)*(R-L),y=p=>B-(p/100)*(B-T);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for(let d=0;d<=100;d+=10){s+=`<line class="grid" x1="${x(d)}" y1="${T}" x2="${x(d)}" y2="${B}"/><text class="ax" x="${x(d)}" y="${B+16}" text-anchor="middle">${d}</text>`}
  for(const p of [0,25,50,75,100]){s+=`<line class="${p===50?"mid":"grid"}" x1="${L}" y1="${y(p)}" x2="${R}" y2="${y(p)}"/><text class="ax" x="${L-6}" y="${y(p)+4}" text-anchor="end">${p}%</text>`}
  s+=`<text class="title" x="${(L+R)/2}" y="${H-6}" text-anchor="middle">Dose (mg)</text>`;
  s+=`<text class="title" transform="translate(13 ${(T+B)/2}) rotate(-90)" text-anchor="middle">% of subjects</text>`;
  curves.forEach((c,ci)=>{
    let p="";for(let d=0;d<=100;d+=2)p+=(d?"L":"M")+x(d).toFixed(1)+" "+y(logi(d,c.ed,c.s)).toFixed(1);
    s+=`<path class="${c.cls}" d="${p}"/>`;
    for(let d=0;d<=100;d+=10)s+=`<circle class="${c.cls==="c-eff"?"d-eff":"d-let"}" cx="${x(d)}" cy="${y(logi(d,c.ed,c.s)).toFixed(1)}" r="3.2"/>`;
    s+=`<rect class="${c.cls==="c-eff"?"d-eff":"d-let"}" x="${L+8+ci*130}" y="7" width="14" height="5" rx="2"/><text class="lg" x="${L+28+ci*130}" y="13">${esc(c.name)}</text>`;
  });
  return s+"</svg>";
}
function genProblem(kind){
  kind=kind||pick(["ed","ld","ti","tinum","hl1","hl2","hl3"]);
  if(kind==="ed"){const ed=pick([20,30,40,50,60]);return{gen:1,u:"dose",t:"num",d:2,q:"Read the graph. What is the ED50 of this anti-anxiety drug?",svg:chartSVG([{ed,s:6,cls:"c-eff",name:"Anxiety relief"}],"Cumulative dose-response curve"),ans:ed,tol:0.5,unit:"mg",x:`Go across from 50%, hit the curve, drop straight down: ${ed} mg.`}}
  if(kind==="ld"){const ed=pick([10,20,30]),ld=pick([60,70,80]);return{gen:1,u:"dose",t:"num",d:2,q:"Read the graph. What is the LD50?",svg:chartSVG([{ed,s:5,cls:"c-eff",name:"Effect"},{ed:ld,s:5,cls:"c-let",name:"Lethal"}],"Effect and lethal dose curves"),ans:ld,tol:0.5,unit:"mg",x:`Use the lethal curve: across from 50%, down to ${ld} mg. (The effect curve’s ED50 is ${ed} mg.)`}}
  if(kind==="ti"){const [ed,ld]=pick([[20,60],[20,80],[30,60],[30,90],[10,80],[10,60]]);return{gen:1,u:"dose",t:"num",d:3,q:"Using both curves, what is this drug’s therapeutic index?",svg:chartSVG([{ed,s:5,cls:"c-eff",name:"Effect"},{ed:ld,s:5,cls:"c-let",name:"Lethal"}],"Effect and lethal dose curves"),ans:ld/ed,tol:0.05,x:`ED50 = ${ed}, LD50 = ${ld}. TI = LD50 ÷ ED50 = ${ld} ÷ ${ed} = ${+(ld/ed).toFixed(2)}. Units cancel.`}}
  if(kind==="tinum"){const [ld,ed,tol]=pick([[130,30,0.4],[200,20,0.05],[150,50,0.05],[90,30,0.05],[400,40,0.05],[60,20,0.05],[300,25,0.05]]);return{gen:1,u:"dose",t:"num",d:2,q:`A drug has an LD50 of ${ld} mg and an ED50 of ${ed} mg. What is its therapeutic index?`,ans:ld/ed,tol,x:`TI = ${ld} ÷ ${ed} = ${+(ld/ed).toFixed(2)}. No units: mg ÷ mg cancel.`}}
  const t=pick([2,3,4,6,8]),n=pick([1,2,3,4]);
  if(kind==="hl1"){const dose=pick([80,160,200,400,800]);const a=dose/2**n;return{gen:1,u:"out",t:"num",d:2,q:`A drug’s half-life is ${t} hours. You take ${dose} mg. How many mg remain in the blood after ${t*n} hours?`,ans:a,tol:0.6,unit:"mg",x:`${t*n} h is ${n} half-li${n>1?"ves":"fe"}: ${dose}${" → ".repeat(0)}${Array.from({length:n},(_,i)=>" → "+dose/2**(i+1)).join("")} mg.`}}
  if(kind==="hl2"){const a=100/2**n;return{gen:1,u:"out",t:"num",d:2,q:`A drug’s half-life is ${t} hours. What percent of the dose remains after ${t*n} hours?`,ans:a,tol:0.1,unit:"%",x:`${n} half-li${n>1?"ves":"fe"}: 100 → ${Array.from({length:n},(_,i)=>100/2**(i+1)).join(" → ")}%.`}}
  return{gen:1,u:"out",t:"num",d:2,q:`A drug’s half-life is ${t} hours. About how many hours until ~94% of it is cleared?`,ans:4*t,tol:0.5,unit:"h",x:`About 4 half-lives clear 94%: 4 × ${t} = ${4*t} hours.`};
}

/* ---------- runs ---------- */
function startRun(mode,unit){
  let items=[];
  const nonEssay=Q.filter(q=>q.t!=="essay");
  if(mode==="quick"){const sorted=nonEssay.slice().sort((a,b)=>prio(a)-prio(b));const used=new Set(),out=[];
    for(const q of sorted){if(out.length>=7)break;if(used.has(q.u)&&out.length<5)continue;used.add(q.u);out.push({id:q.id})}
    items=shuffle(out);items.splice(1+Math.floor(Math.random()*5),0,{gen:genProblem()});}
  else if(mode==="unit"){items=shuffle(nonEssay.filter(q=>q.u===unit).sort((a,b)=>prio(a)-prio(b)).slice(0,8).map(q=>({id:q.id})));
    if(unit==="dose")items.push({gen:genProblem("ed")},{gen:genProblem(pick(["ti","tinum"]))});
    if(unit==="out")items.push({gen:genProblem(pick(["hl1","hl2","hl3"]))});
    const boss=Q.find(q=>q.t==="essay"&&q.u===unit);if(boss)items.push({id:boss.id});}
  else if(mode==="boss"){items=Q.filter(q=>q.t==="essay").sort((a,b)=>prio(a)-prio(b)).slice(0,3).map(q=>({id:q.id}))}
  else if(mode==="review"){items=shuffle(reviewPool()).slice(0,10).map(q=>({id:q.id}))}
  else if(mode==="lab"){items=["ed","ti","hl1","tinum","ld","hl2"].map(k=>({gen:genProblem(k)}))}
  if(!items.length)return;
  S.run={mode,unit:unit||null,items,i:0,res:[],xp:0};save();view="play";render();
}
const curQ=()=>{const it=S.run.items[S.run.i];return it.gen||QBY[it.id]};

/* ---------- scoring ---------- */
function award(q,result){
  const base=q.t==="essay"?0:({1:10,2:20,3:35}[q.d]||20);
  const prevStreak=S.streak;let xp=0;
  if(result==="right"){S.streak++;xp=Math.round(base*(1+Math.min(1,Math.floor((S.streak-1)/3)*0.25)))}
  else if(result==="close"){xp=Math.round(base*0.5)}
  else{S.streak=0}
  S.best=Math.max(S.best,S.streak);S.answered++;if(result==="right")S.right++;
  if(!q.gen){const b=S.box[q.id]||{b:0,due:0};b.b=result==="right"?Math.min(5,b.b+1):result==="close"?Math.max(1,b.b):1;b.due=Date.now()+GAPS[b.b]*DAY;S.box[q.id]=b}
  return{xp,prevStreak};
}
function addXP(xp){const before=lvlFor(S.xp);S.xp+=xp;S.run.xp+=xp;const after=lvlFor(S.xp);if(after>before)levelUp(after)}

/* ---------- fx ---------- */
let actx=null;
function beep(f,len){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+len);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+len)}catch(e){}}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(){if(reduce)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue("--cap-a"),cs.getPropertyValue("--cap-b"),cs.getPropertyValue("--accent")];
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*0.32,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,w:6+Math.random()*7,c:pick(cols),r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();}
function levelUp(l){beep(660,.15);setTimeout(()=>beep(880,.25),130);burst();const t=document.createElement("div");t.className="toast";t.innerHTML=`Level up<b>Lv ${l} · ${esc(rank(l))}</b>`;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}

/* ---------- render ---------- */
function renderBar(){
  const l=lvlFor(S.xp),cur=S.xp-need(l),span=need(l+1)-need(l),pct=Math.min(100,cur/span*100);
  $("#lvlNum").textContent=`Lv ${l} · ${rank(l)}`;$("#xpText").textContent=`${cur} / ${span} XP`;
  const fill=$("#xpFill");fill.style.width=pct+"%";fill.style.setProperty("--fullw",(pct?100/pct*100:100)+"%");
  const sc=$("#streakChip");sc.textContent=`streak ${S.streak}`;sc.classList.toggle("hot",S.streak>=3);
  const sb=$("#soundBtn");sb.textContent=S.sound?"Sound on":"Sound off";sb.setAttribute("aria-pressed",S.sound);
  $("#tab-home").setAttribute("aria-selected",view!=="guide");$("#tab-guide").setAttribute("aria-selected",view==="guide");
}
function render(){renderBar();const app=$("#app");
  if(view==="guide"){app.innerHTML="";app.appendChild($("#guideTpl").content.cloneNode(true));return}
  if(view==="play"&&S.run){renderPlay(app);return}
  view="home";renderHome(app);
}
function renderHome(app){
  const rp=reviewPool().length,acc=S.answered?Math.round(S.right/S.answered*100):0;
  const run=S.run;
  app.innerHTML=`
  <section class="hero">
    <span class="label">Exam 1 · Friday · short essay</span>
    <h1>Learn it one dose at a time.</h1>
    <p>Every question is from Dr. Baker’s Week 1–2 lectures and slides. Hints are free. Wrong answers come back later until they stick.</p>
    <div class="plan">
      <div class="plan-box"><span class="label">Tonight</span><ol><li>Two quick runs</li><li>Play any unit under half full</li><li>Graph lab once</li><li>Write one boss essay by hand, then sleep</li></ol></div>
      <div class="plan-box"><span class="label">Exam morning</span><ol><li>Review misses</li><li>Skim the evidence bank</li><li>One boss essay, 10 minutes</li></ol></div>
    </div>
  </section>
  ${run?`<div class="resume"><b>Run paused at ${run.i+1} of ${run.items.length}</b><span class="muted" style="flex:1">${esc(run.mode==="unit"?(UNITS.find(u=>u.id===run.unit)||{}).name:{quick:"Quick run",boss:"Boss essays",review:"Review",lab:"Graph lab"}[run.mode])}</span><button class="btn btn-main" id="resume" type="button">Resume</button><button class="btn btn-quiet" id="drop" type="button">Discard</button></div>`:""}
  <div class="modes">
    <button class="mode primary" data-mode="quick" type="button"><b>Quick run</b><span>8 questions, mixed units, one graph problem</span></button>
    <button class="mode" data-mode="boss" type="button"><b>Boss essays</b><span>3 exam-style prompts with a checklist</span></button>
    <button class="mode" data-mode="lab" type="button"><b>Graph lab</b><span>ED50, LD50, TI and half-life math</span></button>
    <button class="mode" data-mode="review" type="button" ${rp?"":"disabled"}><b>Review misses</b><span>${rp?rp+" waiting":"Nothing waiting yet"}</span></button>
  </div>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="font-size:22px">Units</h2><span class="label">Mastery</span></div>
  <div class="units">${UNITS.map(u=>{const m=mastery(u.id);return`<div class="unit"><div class="unit-name">${esc(u.name)}<small>${esc(u.sub)}</small></div><div class="capsule" title="${Math.round(m*100)}% mastered"><i style="width:${m*100}%;--fullw:${m?100/m:100}%"></i></div><button class="btn btn-line" data-unit="${u.id}" type="button" style="padding:7px 14px">Play</button></div>`}).join("")}</div>
  <div class="stats"><span>Answered <b>${S.answered}</b></span><span>Accuracy <b>${acc}%</b></span><span>Best streak <b>${S.best}</b></span><span>Total XP <b>${S.xp}</b></span>
  ${S.answered?(confirmReset?`<span class="inline-confirm">Erase all progress? <button class="btn btn-quiet" id="resetYes" type="button" style="color:var(--bad)">Erase</button><button class="btn btn-quiet" id="resetNo" type="button">Keep</button></span>`:`<button class="btn btn-quiet" id="reset" type="button" style="padding:0">Reset progress</button>`):""}</div>`;
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>startRun(b.dataset.mode));
  app.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>startRun("unit",b.dataset.unit));
  const r=$("#resume");if(r)r.onclick=()=>{view="play";render()};
  const d=$("#drop");if(d)d.onclick=()=>{S.run=null;save();render()};
  const rs=$("#reset");if(rs)rs.onclick=()=>{confirmReset=true;render()};
  const ry=$("#resetYes");if(ry)ry.onclick=()=>{const snd=S.sound;S=blank();S.sound=snd;confirmReset=false;save();render()};
  const rn=$("#resetNo");if(rn)rn.onclick=()=>{confirmReset=false;render()};
}

let phase="ask",last=null,hintOn=false;
function renderPlay(app){
  const run=S.run;
  if(run.i>=run.items.length){renderEnd(app);return}
  const q=curQ(),unitName=(UNITS.find(u=>u.id===q.u)||{}).name||"";
  const pips=run.items.map((_,i)=>`<span class="pip ${run.res[i]||(i===run.i?"now":"")}"></span>`).join("");
  const isBoss=q.t==="essay";
  let body="";
  if(q.t==="pick"){const opts=run.items[run.i].order||(run.items[run.i].order=shuffle(q.c));
    body=`<div class="choices">${opts.map((c,i)=>`<button class="choice" data-c="${esc(c)}" type="button"><kbd>${i+1}</kbd><span>${esc(c)}</span></button>`).join("")}</div>`}
  else if(q.t==="essay"){body=`<textarea class="answer" id="ans" placeholder="Write it like the exam: a claim, then evidence from class. Aim for 5+ points."></textarea>
    <div class="actions"><button class="btn btn-main" id="go" type="button">Check against the rubric</button><button class="btn btn-quiet" id="skipWrite" type="button">Just show the rubric</button></div>`}
  else{body=`<input class="answer" id="ans" autocomplete="off" ${q.t==="num"?'inputmode="decimal"':""} placeholder="${q.t==="num"?"Number"+(q.unit?" ("+q.unit+")":""):"Type your answer"}">
    <div class="actions"><button class="btn btn-main" id="go" type="button">Check</button><button class="btn btn-line" id="hintBtn" type="button">Hint</button><button class="btn btn-quiet" id="skip" type="button">Skip</button></div>
    <div class="hint" id="hint" ${hintOn?"":"hidden"}>${esc(q.t==="num"?(q.u==="dose"?(/TI|therapeutic/i.test(q.q)?"TI = LD50 ÷ ED50":"Across from 50%, then straight down"):"Halve once per half-life"):autoHint(q))}</div>`}
  app.innerHTML=`<div class="pips">${pips}</div>
  <article class="card ${isBoss?"boss":""}" id="card">
    <div class="meta">${isBoss?'<span class="tag boss">Boss essay</span>':""}<span class="tag">${esc(unitName)}</span>${q.d===3?'<span class="tag d3">Hard</span>':""}${q.gen?'<span class="tag">Calculation</span>':""}</div>
    <h2 class="prompt">${esc(q.q)}</h2>
    ${q.svg?`<div class="chart-wrap">${q.svg}</div>`:""}
    <div id="body">${body}</div>
    <div id="fbArea"></div>
  </article>
  <div class="foot"><button class="btn btn-quiet" id="pause" type="button" style="padding:0">Take a break (saves your spot)</button><span class="mono">${run.i+1} / ${run.items.length} · +${run.xp} XP this run</span></div>`;
  phase="ask";
  $("#pause").onclick=()=>{view="home";hintOn=false;render()};
  if(q.t==="pick"){app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answerPick(b.dataset.c))}
  else if(q.t==="essay"){$("#go").onclick=()=>essayRubric(false);$("#skipWrite").onclick=()=>essayRubric(true);setTimeout(()=>$("#ans")&&$("#ans").focus(),30)}
  else{const inp=$("#ans");setTimeout(()=>inp.focus(),30);$("#go").onclick=answerType;$("#skip").onclick=()=>{inp.value="";answerType(true)};
    $("#hintBtn").onclick=()=>{hintOn=true;$("#hint").hidden=false;inp.focus()};}
}
function showFeedback(q,result,xp,extra){
  const fb=$("#fbArea");const title={right:"Nailed it",close:"Close: partial credit",miss:"Not this time"}[result];
  fb.innerHTML=`<div class="fb ${result}" role="status"><div class="fb-head">${title}${xp?`<span class="xp-pop">+${xp} XP</span>`:""}</div>
   ${extra||""}<p>${esc(q.x)}</p>
   <div class="actions">${result!=="right"&&q.t!=="pick"?`<button class="btn btn-line" id="knew" type="button">I had it right</button>`:""}<button class="btn btn-main" id="next" type="button">${S.run.i+1===S.run.items.length?"Finish run":"Next"}</button></div></div>`;
  $("#next").onclick=next;setTimeout(()=>$("#next").focus(),20);
  const k=$("#knew");if(k)k.onclick=()=>override(q);
  if(result==="miss"){$("#card").classList.remove("shake");void $("#card").offsetWidth;$("#card").classList.add("shake");beep(196,.18)}else beep(result==="right"?740:520,.12);
  phase="feedback";renderBar();
  const pipEl=document.querySelectorAll(".pip")[S.run.i];if(pipEl)pipEl.className="pip "+result;
}
function record(q,result){const {xp,prevStreak}=award(q,result);S.run.res[S.run.i]=result;last={q,result,xp,prevStreak};addXP(xp);save();return xp}
function answerPick(choice){if(phase!=="ask")return;const q=curQ();const result=choice===q.ok?"right":"miss";
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.c===q.ok)b.classList.add("is-right");else if(b.dataset.c===choice)b.classList.add("is-wrong")});
  showFeedback(q,result,record(q,result));}
function answerType(skipped){if(phase!=="ask")return;const q=curQ(),inp=$("#ans"),v=inp.value.trim();
  if(!v&&skipped!==true){inp.focus();return}
  let result,extra="";
  if(q.t==="num"){const m=v.replace(/,/g,"").match(/-?\d+(\.\d+)?/);const n=m?parseFloat(m[0]):NaN;result=!isNaN(n)&&Math.abs(n-q.ans)<=q.tol?"right":"miss";
    extra=`<p class="model">Answer: <b class="mono">${+q.ans.toFixed(2)}${q.unit?" "+q.unit:""}</b></p>`;}
  else{result=gradeText(q,v);if(q.a&&result!=="right")extra=`<p class="model">Answer: <b>${esc(q.a[0])}</b></p>`}
  inp.disabled=true;document.querySelectorAll("#body .actions button").forEach(b=>b.disabled=true);
  showFeedback(q,result,record(q,result),extra);}
function override(q){if(!last||last.q!==q||last.result==="right")return;
  const base={1:10,2:20,3:35}[q.d]||20;S.streak=last.prevStreak+1;S.best=Math.max(S.best,S.streak);S.right++;
  const full=Math.round(base*(1+Math.min(1,Math.floor((S.streak-1)/3)*0.25)));const add=full-last.xp;
  if(!q.gen){const b=S.box[q.id];b.b=Math.min(5,Math.max(b.b,(b.b||0)+1));b.due=Date.now()+GAPS[b.b]*DAY}
  S.run.res[S.run.i]="right";last.result="right";addXP(add);save();
  const fb=$("#fbArea .fb");fb.className="fb right";fb.querySelector(".fb-head").innerHTML=`Counted as right<span class="xp-pop">+${full} XP</span>`;$("#knew").remove();
  const pipEl=document.querySelectorAll(".pip")[S.run.i];if(pipEl)pipEl.className="pip right";renderBar();}
function essayRubric(skipped){if(phase!=="ask")return;const q=curQ(),txt=$("#ans").value,n=norm(txt);
  $("#ans").readOnly=true;$("#body .actions").remove();
  const found=q.pts.map(pt=>!skipped&&pt.k.some(w=>hasTerm(n,w)));
  $("#fbArea").innerHTML=`<div class="fb close" style="border-color:var(--line);background:var(--paper)"><div class="fb-head">Rubric</div>
   <p class="model">${skipped?"Tick each point you could explain from memory.":"Points your answer seems to cover are ticked. Untick any you only name-dropped; tick any you explained in other words."}</p>
   <div class="check">${q.pts.map((pt,i)=>`<label class="${found[i]?"found":""}"><input type="checkbox" id="pt${i}" ${found[i]?"checked":""}><span>${esc(pt.p)}</span></label>`).join("")}</div>
   <div class="actions"><button class="btn btn-main" id="claim" type="button">Score it</button></div></div>`;
  phase="rubric";$("#claim").onclick=()=>{const got=q.pts.filter((_,i)=>$("#pt"+i).checked).length,ratio=got/q.pts.length;
    const result=ratio>=0.6?"right":ratio>=0.3?"close":"miss";const {prevStreak}=award(q,result);
    const xp=got*12+(result==="right"?30:0);S.run.res[S.run.i]=result;last={q,result,xp,prevStreak};addXP(xp);save();
    phase="ask";showFeedback({...q,x:`You covered ${got} of ${q.pts.length} points. ${result==="right"?"That’s an exam-ready answer.":"Reread the unchecked points, then try this boss again later."}`,t:"pick"},result,xp);}}
function next(){if(phase!=="feedback")return;S.run.i++;hintOn=false;save();render();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})}
function renderEnd(app){const run=S.run,r=run.res.filter(x=>x==="right").length;
  app.innerHTML=`<div class="card end"><span class="label">Run complete</span><div class="big mono">${r} / ${run.items.length}</div>
  <p style="margin:0">+${run.xp} XP · Level ${lvlFor(S.xp)} · ${esc(rank(lvlFor(S.xp)))}</p>
  <p class="muted" style="margin:0;max-width:46ch">${r===run.items.length?"Clean run. Those cards move further out in your review schedule.":"Misses go into Review. They’ll come back until they stick."}</p>
  <div class="row" style="justify-content:center"><button class="btn btn-main" id="again" type="button">Another quick run</button><button class="btn btn-line" id="home" type="button">Back to units</button></div></div>`;
  if(r===run.items.length)burst();
  S.run=null;save();$("#again").onclick=()=>startRun("quick");$("#home").onclick=()=>{view="home";render()};}

/* ---------- wiring ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="play"||!S.run)return;
  if(e.key==="Enter"&&!e.shiftKey){
    if(phase==="feedback"){e.preventDefault();next();return}
    if(phase==="ask"&&document.activeElement&&document.activeElement.id==="ans"&&document.activeElement.tagName==="INPUT"){e.preventDefault();answerType()}
  }
  if(phase==="ask"&&/^[1-4]$/.test(e.key)&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){const b=document.querySelectorAll(".choice")[+e.key-1];if(b)b.click()}
});
$("#tab-home").onclick=()=>{view=S.run&&view==="play"?"play":"home";if(view!=="play")view="home";render()};
$("#tab-guide").onclick=()=>{view="guide";render()};
$("#soundBtn").onclick=()=>{S.sound=!S.sound;save();renderBar();beep(600,.1)};

function boot(data){if(data&&data.S)S=Object.assign(blank(),data.S);render()}
try{window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==="function"&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.ready==="function")window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>

</body>
</html>
